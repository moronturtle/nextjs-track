<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — State Management Lanjutan</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Apa yang dimaksud dengan prop drilling?",
          opsi: [
            "Menulis props dengan nama yang salah",
            "Meneruskan data lewat beberapa komponen, meskipun komponen di tengah tidak memakai data itu",
            "Membaca data dari Context",
            "Mengubah props parent dari dalam komponen anak",
          ],
          jawaban: 1,
          pembahasan: "Props dikirim dari parent ke anak. Jika datanya harus melewati banyak komponen yang tidak memakainya, cara ini disebut prop drilling.",
        },
        {
          soal: "Bagaimana Context membantu mengurangi prop drilling?",
          opsi: [
            "Context membuat props mengalir ke atas",
            "Komponen di dalam Provider membaca nilai tanpa meneruskannya lewat setiap komponen di tengah",
            "Semua komponen otomatis berbagi semua state",
            "Context menghapus kebutuhan props di seluruh aplikasi",
          ],
          jawaban: 1,
          pembahasan: "Provider membagikan nilai. Komponen di dalamnya dapat membaca nilai dengan useContext, jadi komponen perantara tidak harus meneruskan props.",
        },
        {
          soal: "Apa tiga bagian utama saat memakai Context?",
          opsi: [
            "useState, useEffect, dan return",
            "createContext untuk membuat Context, Provider untuk membagikan nilai, dan useContext untuk membaca nilai",
            "props, children, dan key",
            "import, export, dan \"use client\"",
          ],
          jawaban: 1,
          pembahasan: "createContext membuat Context, Provider menyediakan nilai untuk komponen di bawahnya, dan useContext membaca nilai tersebut.",
        },
        {
          soal: "Menu dan semua halaman perlu membaca tema yang sama. Di mana Provider sebaiknya dipasang?",
          opsi: [
            "Di dalam tombol pengubah tema",
            "Di app/layout.tsx, yang membungkus semua halaman",
            "Di setiap file page.tsx",
            "Di package.json",
          ],
          jawaban: 1,
          pembahasan: "Komponen hanya dapat membaca Provider yang membungkusnya. Root layout membungkus semua halaman, jadi pasang Provider di sana jika semua halaman memerlukan tema.",
        },
        {
          soal: "Mengapa tema-context.tsx diawali dengan \"use client\"?",
          opsi: [
            "Agar file dapat diimpor file lain",
            "Karena file memakai useState dan useContext, yang dipakai di Client Component",
            "Supaya Provider tidak perlu dibuat",
            "Agar data otomatis disimpan ke database",
          ],
          jawaban: 1,
          pembahasan: "tema-context.tsx memakai hook React. File yang memakai hook untuk interaksi harus menjadi bagian Client Component, dengan \"use client\" di awal file.",
        },
        {
          soal: "Data hanya dipakai satu komponen. Cara mana yang paling sederhana?",
          opsi: [
            "Pakai Context untuk semua data",
            "Pakai useState di komponen yang membutuhkan data",
            "Pasang Provider di root layout",
            "Buat store Zustand untuk data tersebut",
          ],
          jawaban: 1,
          pembahasan: "Data yang hanya dipakai satu komponen cukup disimpan dengan useState di komponen itu. Context berguna ketika banyak komponen perlu data yang sama.",
        },
        {
          soal: "Bagaimana komponen membaca daftar dari store Zustand bernama useFavorit?",
          opsi: [
            "Pasang Provider di app/layout.tsx",
            "Buat Context baru di setiap komponen",
            "Panggil useFavorit(), lalu ambil daftar dari hasilnya",
            "Kirim perintah dengan dispatch",
          ],
          jawaban: 2,
          pembahasan: "create dari Zustand membuat hook useFavorit. Komponen dapat memanggil useFavorit(), lalu mengambil daftar dari hasilnya. Provider tidak diperlukan.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
