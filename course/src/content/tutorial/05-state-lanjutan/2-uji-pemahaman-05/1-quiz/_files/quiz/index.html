<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — State Management Lanjutan</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Apa itu prop drilling?",
          opsi: [
            "Menulis props dengan nama yang salah",
            "Mengoper props berlapis-lapis ke komponen dalam — komponen tengah jadi kurir yang tidak memakai datanya",
            "Membaca data langsung dari context",
            "Mengubah props milik parent dari dalam anak",
          ],
          jawaban: 1,
          pembahasan: "Props hanya mengalir turun satu tingkat per langkah. Data untuk komponen dalam harus diestafet lewat semua komponen di tengahnya — itulah prop drilling.",
        },
        {
          soal: "Bagaimana Context menjawab masalah prop drilling?",
          opsi: [
            "Props bisa mengalir naik ke parent",
            "Komponen dalam membaca nilai langsung dari Provider, tanpa dioper lewat komponen tengah",
            "Semua komponen berbagi satu state otomatis",
            "Props tidak lagi diperlukan sama sekali",
          ],
          jawaban: 1,
          pembahasan: "Provider memasang nilai di atas; komponen mana pun di bawahnya membaca langsung dengan useContext. Komponen tengah bebas dari props yang bukan urusannya.",
        },
        {
          soal: "Tiga bagian untuk memakai Context adalah…",
          opsi: [
            "useState, useEffect, dan return",
            "createContext, Provider dengan value, dan useContext",
            "props, children, dan key",
            "import, export, dan \"use client\"",
          ],
          jawaban: 1,
          pembahasan: "createContext membuat salurannya, Provider memasang nilainya di atas, useContext membaca nilainya dari dalam.",
        },
        {
          soal: "Kamu ingin tema bisa dibaca semua halaman. Di mana Provider dipasang?",
          opsi: [
            "Di dalam tombol yang mengubah tema",
            "Di app/layout.tsx, membungkus semua halaman",
            "Di file page.tsx setiap halaman",
            "Di package.json",
          ],
          jawaban: 1,
          pembahasan: "Komponen hanya bisa membaca Provider di atasnya. Untuk seluruh aplikasi, pasang di root layout. Kalau hanya section blog yang butuh, cukup di app/blog/layout.tsx.",
        },
        {
          soal: "Kenapa file context seperti tema-context.tsx perlu \"use client\"?",
          opsi: [
            "Agar file-nya bisa di-import file lain",
            "Karena memakai hook seperti useState dan useContext, yang hanya hidup di browser",
            "Supaya tidak perlu menulis Provider",
            "Agar datanya tersimpan ke database",
          ],
          jawaban: 1,
          pembahasan: "Provider yang menampung state memakai hook — dan semua hook hanya berjalan di browser. Ini aturan yang sama dari pertemuan 03 dan 04.",
        },
        {
          soal: "Kapan sebaiknya TIDAK memakai Context?",
          opsi: [
            "Saat data dipakai banyak komponen di banyak halaman",
            "Saat data hanya dipakai satu komponen atau parent dengan satu-dua anak — useState dan props lebih jelas",
            "Saat project memakai TypeScript",
            "Saat aplikasi berjalan di browser",
          ],
          jawaban: 1,
          pembahasan: "Context untuk data yang dipakai banyak komponen di banyak kedalaman — tema, pengguna login, bahasa. State lokal tetap pakai useState; parent-anak dekat tetap pakai props.",
        },
        {
          soal: "Di Redux Toolkit, apa yang terjadi saat komponen menjalankan dispatch(toggle(slug))?",
          opsi: [
            "Komponen mengubah store-nya langsung",
            "Action dikirim ke store, lalu reducer toggle di slice yang mengubah datanya",
            "Provider memanggil useSelector untuk semua komponen",
            "Data langsung tersimpan ke database",
          ],
          jawaban: 1,
          pembahasan: "Komponen tidak menyentuh store langsung — dia mengirim action lewat dispatch, dan reducer di dalam slice yang mengubah state. Pembacaan datanya lewat useSelector.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
