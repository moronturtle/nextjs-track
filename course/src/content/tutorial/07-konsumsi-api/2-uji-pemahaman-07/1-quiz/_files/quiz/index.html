<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Mengambil data dari API</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Apa yang dikirim server saat kita membuka alamat API di browser?",
          opsi: [
            "Data dalam format JSON, yang bentuknya mirip objek JavaScript",
            "Halaman HTML yang siap tampil",
            "File gambar berisi data",
            "Kode JavaScript yang langsung dijalankan",
          ],
          jawaban: 0,
          pembahasan: "API mengirim data JSON. Halaman web biasa biasanya mengirim HTML untuk ditampilkan browser.",
        },
        {
          soal: "Kenapa kita memakai await pada fetch() dan res.json()?",
          opsi: [
            "Karena await membuat request lebih cepat",
            "Karena hasilnya perlu waktu untuk tersedia, jadi kode menunggunya",
            "Karena fetch tidak boleh ada di dalam useEffect",
            "Karena tanpa await browser akan menutup tab",
          ],
          jawaban: 1,
          pembahasan: "fetch mengirim request ke internet dan res.json membaca isi jawabannya. Keduanya butuh waktu, jadi hasilnya ditunggu dengan await.",
        },
        {
          soal: "Apa yang dilakukan res.json()?",
          opsi: [
            "Mengirim data ke server",
            "Membaca JSON dari server dan mengubahnya menjadi data JavaScript",
            "Memeriksa apakah server masih hidup",
            "Mengubah objek menjadi teks JSON",
          ],
          jawaban: 1,
          pembahasan: "res.json() membaca jawaban server dan mengubah teks JSON menjadi data JavaScript yang bisa dipakai aplikasi.",
        },
        {
          soal: "Kenapa fetch dipanggil di dalam useEffect?",
          opsi: [
            "Agar request dikirim setelah komponen tampil, bukan setiap kali komponen dirender",
            "Karena fetch tidak bisa membaca state",
            "Karena useEffect membuat internet lebih stabil",
            "Karena fetch hanya boleh ada di dalam Context",
          ],
          jawaban: 0,
          pembahasan: "Kode di badan komponen berjalan setiap kali komponen dirender. useEffect dengan [] menjalankan request saat komponen pertama kali tampil.",
        },
        {
          soal: "Server menjawab dengan status 404. Apa yang perlu dilakukan aplikasi?",
          opsi: [
            "Periksa res.ok karena fetch tetap menerima jawaban 404",
            "Tidak perlu memeriksa status jawaban",
            "fetch mengulang request tiga kali",
            "Browser langsung menampilkan halaman error",
          ],
          jawaban: 0,
          pembahasan: "fetch tetap menerima jawaban 404 atau 500. Periksa res.ok untuk mengetahui apakah statusnya berhasil (200–299).",
        },
        {
          soal: "Apa arti ?owner=budi pada alamat API latihan?",
          opsi: [
            "Memilih daftar Todo milik nama budi",
            "Membuat request lebih aman",
            "Mengurutkan daftar berdasarkan nama",
            "Memilih bahasa jawaban server",
          ],
          jawaban: 0,
          pembahasan: "owner adalah parameter query yang memilih daftar Todo. Nama yang berbeda memiliki daftar yang terpisah.",
        },
        {
          soal: "Untuk apa state sedangMemuat?",
          opsi: [
            "Agar halaman menunjukkan bahwa data masih diminta dari server",
            "Supaya fetch boleh dipakai di komponen client",
            "Karena useState hanya boleh dipakai dua kali",
            "Supaya komponen tidak dihapus React",
          ],
          jawaban: 0,
          pembahasan: "Jawaban server perlu waktu untuk datang. State sedangMemuat membuat halaman menampilkan pesan, bukan daftar kosong.",
        },
        {
          soal: "Bagaimana halaman daftar dan detail mendapat data Todo?",
          opsi: [
            "Keduanya mengambil data melalui useTodos() dari TodoProvider",
            "Keduanya membaca localStorage masing-masing",
            "Halaman detail menyalin state dari halaman daftar",
            "Keduanya mengirim request fetch yang berbeda",
          ],
          jawaban: 0,
          pembahasan: "TodoProvider mengambil daftar dari server dan membagikan todos, sedangMemuat, serta error lewat Context.",
        },
        {
          soal: "Kenapa Todo baru belum tersimpan setelah halaman dimuat ulang?",
          opsi: [
            "Karena tambahTodo baru mengubah state di browser dan belum mengirim perubahan ke server",
            "Karena server menolak tugas baru",
            "Karena localStorage sudah tidak boleh dipakai",
            "Karena id tugasnya salah dibuat",
          ],
          jawaban: 0,
          pembahasan: "Pertemuan ini baru mengambil data dari server. Cara mengirim Todo baru akan dipelajari di pertemuan 08.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
