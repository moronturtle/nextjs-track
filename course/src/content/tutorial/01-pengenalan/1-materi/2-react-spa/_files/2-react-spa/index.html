<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Toko Roti Kecil</title>
  </head>
  <body>
    <!-- Inilah yang diterima browser: sebuah <div> KOSONG -->
    <div id="root"></div>

    <hr />
    <!-- Jam ini dicetak SEKALI saat HTML diambil — dan tidak akan berubah lagi -->
    <p><em>HTML ini diterima dari server pukul <strong>{{WAKTU}}</strong></em></p>

    <!--
      Browser tidak mengerti JSX (main.jsx) — maka yang dimuat adalah
      main.js, yaitu main.jsx setelah diterjemahkan. Di proyek nyata,
      terjemahan ini dikerjakan otomatis oleh bundler (Vite/Next.js).
      React sendiri dimuat dari folder vendor/ agar tanpa install.
    -->
    <script src="/vendor/react.production.min.js"></script>
    <script src="/vendor/react-dom.production.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
