<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Navigasi dan Layout</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "File app/blog/artikel-pertama/page.tsx bisa dibuka di alamat apa?",
          opsi: [
            "/artikel-pertama",
            "/blog/artikel-pertama",
            "/blog/page/artikel-pertama",
            "/app/blog/artikel-pertama",
          ],
          jawaban: 1,
          pembahasan: "Setiap tingkat folder menambah satu potongan alamat. Nama file page.tsx tidak ikut ke URL — jadi app/blog/artikel-pertama/page.tsx menjadi /blog/artikel-pertama.",
        },
        {
          soal: "Kamu ingin satu file menangani SEMUA tulisan — /blog/apa-saja, /blog/belajar-nextjs, dan seterusnya. Struktur mana yang benar?",
          opsi: [
            "app/blog/semua/page.tsx",
            "app/blog/(slug)/page.tsx",
            "app/blog/{slug}/page.tsx",
            "app/blog/[slug]/page.tsx",
          ],
          jawaban: 3,
          pembahasan: "Kurung siku [slug] menandai route dinamis — potongan alamat itu bebas dan nilainya dibaca lewat params.",
        },
        {
          soal: "Di Next.js 15 ke atas, bagaimana cara membaca slug di dalam page.tsx route dinamis?",
          opsi: [
            "Langsung tulis params.slug tanpa await",
            "const { slug } = await params — di fungsi bertanda async",
            "Membaca window.location.pathname",
            "Lewat props bernama slug yang dikirim otomatis",
          ],
          jawaban: 1,
          pembahasan: "params berupa Promise, jadi isinya diambil dengan await — karena itu fungsi halaman ditandai async.",
        },
        {
          soal: "Apa beda app/blog/layout.tsx dengan app/layout.tsx?",
          opsi: [
            "Tidak ada beda — keduanya membungkus semua halaman",
            "Blog layout menggantikan root layout untuk halaman blog",
            "Blog layout hanya membungkus halaman di bawah /blog dan tidak boleh punya <html>/<body>",
            "Blog layout wajib punya <html> dan <body> sendiri",
          ],
          jawaban: 2,
          pembahasan: "Nested layout hanya membungkus section-nya dan disusun di dalam root layout. <html> dan <body> hanya milik root layout — menulisnya lagi berarti dokumen HTML bertumpuk.",
        },
        {
          soal: "Apa keuntungan <Link> dari next/link dibanding <a> biasa untuk navigasi dalam project?",
          opsi: [
            "Link otomatis berwarna biru dan bergaris bawah",
            "Pindah halaman tanpa reload penuh, plus prefetch yang menyiapkan tujuan sebelum diklik",
            "Link membuat URL lebih pendek",
            "Link wajib dipakai supaya website terbaca Google",
          ],
          jawaban: 1,
          pembahasan: "Link mengganti isi halaman di browser seperti SPA, sementara halaman pertama tetap HTML lengkap seperti HTML biasa — gabungan dua kelebihan dari pertemuan 01. Untuk alamat di luar project, tetap pakai <a>.",
        },
        {
          soal: "Menu navigasi perlu menandai link yang sedang aktif. Apa yang dibutuhkan komponen menu?",
          opsi: [
            "useRouter() dan baris \"use client\"",
            "usePathname() dan baris \"use client\"",
            "props params di layout",
            "document.location di komponen server",
          ],
          jawaban: 1,
          pembahasan: "usePathname() dari next/navigation mengembalikan alamat yang sedang dibuka — tinggal dibandingkan dengan href tiap link. Hook hanya jalan di Client Component, jadi file perlu \"use client\".",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
