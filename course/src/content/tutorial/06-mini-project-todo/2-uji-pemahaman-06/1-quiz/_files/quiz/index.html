<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Mini Project Todo</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Di mini project ini, kenapa logika interaktif ada di todo-app.tsx yang terpisah dari page.tsx?",
          opsi: [
            "Karena page.tsx komponen server — hook seperti useState tidak boleh di dalamnya, jadi bagian interaktif pindah ke komponen \"use client\"",
            "Karena file client lebih cepat dimuat",
            "Karena page.tsx hanya boleh berisi satu komponen",
            "Agar nama file-nya lebih rapi",
          ],
          jawaban: 0,
          pembahasan: "Pola dari pertemuan 03 dan 04: page.tsx menyusun halaman sebagai komponen server, dan semua yang memakai hook pindah ke komponen \"use client\" di file sendiri.",
        },
        {
          soal: "Saat menambah tugas kita menulis setTodos([...todos, baru]). Kenapa tidak todos.push(baru)?",
          opsi: [
            "push lebih lambat daripada spread",
            "push mengubah array yang sama — React tidak tahu ada perubahan sehingga tampilan tidak ikut diperbarui",
            "push tidak tersedia di TypeScript",
            "spread lebih pendek ditulis",
          ],
          jawaban: 1,
          pembahasan: "React mendeteksi perubahan dari identitas state-nya. push mengubah array lama di tempat, sehingga React menganggap tidak ada yang berubah. Pola yang sama berlaku untuk mengubah (map) dan menghapus (filter).",
        },
        {
          soal: "Kenapa todos harus melewati JSON.stringify saat disimpan dan JSON.parse saat dibaca?",
          opsi: [
            "Karena localStorage hanya menyimpan teks — array diubah jadi string JSON dulu, lalu dikembalikan jadi array saat dibaca",
            "Karena JSON membuat data lebih aman dari peretas",
            "Karena useState hanya menerima string",
            "Supaya ukuran datanya lebih kecil",
          ],
          jawaban: 0,
          pembahasan: "Penyimpanan browser seperti localStorage hanya mengenal string. Ini pola yang sama dengan tombol suka di pertemuan 04 — bedanya hanya isinya yang sekarang array.",
        },
        {
          soal: "Halaman detail /todo/42 membaca daftar tugas dari localStorage, bukan dari props atau Context. Kenapa?",
          opsi: [
            "Karena localStorage lebih cepat dibaca",
            "Karena pindah ke halaman lain berarti komponen dan state-nya dibuat ulang — tapi localStorage milik browser, jadi bisa dibaca halaman mana pun",
            "Karena Context tidak bisa dipakai di project ini",
            "Karena props tidak bisa berisi angka",
          ],
          jawaban: 1,
          pembahasan: "State useState hilang saat pindah halaman. localStorage disimpan browser di luar React, jadi berfungsi sebagai sumber data bersama untuk daftar dan halaman detail.",
        },
        {
          soal: "Di detail-todo.tsx ada useState<Todo | null>(null) dan if (!todo). Untuk apa?",
          opsi: [
            "Supaya TypeScript tidak error saat compile",
            "Menandai data belum tentu ada — komponen menampilkan \"tidak ditemukan\" sebelum tugasnya ketemu di localStorage atau kalau id-nya salah",
            "Agar komponen tidak render sama sekali",
            "Karena Todo wajib berpasangan dengan null",
          ],
          jawaban: 1,
          pembahasan: "Nilai awalnya null — belum ada tugas. Effect mengisinya begitu menemukan id yang cocok. if (!todo) menjaga komponen supaya tidak mencoba menampilkan data yang belum ada.",
        },
        {
          soal: "Menu \"Todo\" tetap ditandai aktif saat kamu ada di /todo/42. Apa yang membuatnya begitu?",
          opsi: [
            "Karena /todo/42 adalah file di dalam folder todo — Next.js menandainya otomatis",
            "Karena Menu memeriksa pathname.startsWith(\"/todo\") — semua alamat di bawah /todo ikut ditandai",
            "Karena tombol ← Kembali sudah ditekan",
            "Karena layout.tsx mendeteksi halaman anaknya",
          ],
          jawaban: 1,
          pembahasan: "Ini trik usePathname dari pertemuan 03: selain cocok persis, menu juga menandai href yang jadi awalan alamat saat ini — jadi /todo/42 tetap dianggap bagian dari Todo.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
