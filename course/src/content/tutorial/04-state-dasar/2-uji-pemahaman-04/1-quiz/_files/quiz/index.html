<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — State Management Dasar</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Saat menulis useState(0), apa yang kita dapatkan?",
          opsi: [
            "Satu angka yang boleh diubah langsung",
            "Nilai awal dan fungsi untuk memberi nilai baru",
            "Semua nilai yang dipakai halaman",
            "Fungsi untuk memuat ulang halaman",
          ],
          jawaban: 1,
          pembahasan: "useState(0) menyiapkan nilai awal 0. React memberikan nilai yang bisa dibaca dan fungsi set, seperti setNilai, untuk memberi nilai baru. Setelah fungsi set dipanggil, tampilan ikut diperbarui.",
        },
        {
          soal: "Apa yang harus ditulis di awal file yang memakai useState di Next.js?",
          opsi: [
            "\"use client\" — karena useState dipakai di browser",
            "Nama folder harus components",
            "Kata async dan await",
            "Tidak perlu menulis apa pun",
          ],
          jawaban: 0,
          pembahasan: "File yang memakai useState perlu diawali \"use client\". Baris itu memberi tahu Next.js bahwa komponen perlu berjalan di browser agar bisa merespons klik.",
        },
        {
          soal: "Bagaimana komponen anak memberi tahu parent (komponen yang menampilkannya) bahwa ada nilai baru?",
          opsi: [
            "Mengubah sendiri props dari parent",
            "Memanggil fungsi yang dikirim parent lewat props",
            "Mengubah langsung state milik parent",
            "Memuat ulang halaman",
          ],
          jawaban: 1,
          pembahasan: "Parent mengirim data dan fungsi ke anak lewat props. Saat ada perubahan, anak memanggil fungsi tersebut untuk mengirim nilai baru ke parent.",
        },
        {
          soal: "Dua komponen anak perlu memakai nilai yang sama. Di mana sebaiknya nilai itu disimpan?",
          opsi: [
            "Buat useState terpisah di setiap komponen",
            "Simpan nilainya di localStorage",
            "Simpan state di parent, lalu kirim ke dua komponen anak",
            "Pindahkan satu komponen ke folder lain",
          ],
          jawaban: 2,
          pembahasan: "Simpan satu state di parent yang menampilkan kedua komponen. Parent mengirim nilai ke anak-anaknya lewat props. Cara ini disebut lifting state up.",
        },
        {
          soal: "Kapan useEffect(fn, []) dijalankan?",
          opsi: [
            "Setiap kali komponen ditampilkan ulang",
            "Saat komponen pertama kali tampil",
            "Sebelum komponen tampil di layar",
            "Hanya saat pengunjung mengklik sesuatu",
          ],
          jawaban: 1,
          pembahasan: "Tanda [] adalah daftar nilai yang diperiksa React. Karena daftar ini kosong, effect dijalankan saat komponen pertama kali tampil.",
        },
        {
          soal: "Kapan useEffect berguna di Next.js?",
          opsi: [
            "Untuk mengambil semua data halaman",
            "Untuk menggantikan useState",
            "Untuk membuat link ke halaman lain",
            "Untuk menjalankan kode di browser, seperti membaca localStorage atau memasang timer",
          ],
          jawaban: 3,
          pembahasan: "useEffect menjalankan kode setelah komponen tampil. Contohnya membaca localStorage atau memasang timer, karena keduanya perlu berjalan di browser.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
