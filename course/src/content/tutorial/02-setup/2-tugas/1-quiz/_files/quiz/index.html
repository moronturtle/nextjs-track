<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Setup Project Next.js</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Saat membuat project baru, apa yang disiapkan oleh recommended defaults?",
          opsi: [
            "TypeScript, ESLint, Tailwind CSS, dan App Router",
            "Hanya HTML dan CSS tanpa React",
            "Database dan akun GitHub",
            "Prettier dan halaman tugas yang sudah jadi",
          ],
          jawaban: 0,
          pembahasan: "Recommended defaults menyiapkan TypeScript, ESLint, Tailwind CSS, dan App Router. Prettier bukan bagian dari pilihan bawaan tersebut.",
        },
        {
          soal: "Project menggunakan npm. File mana yang mencatat versi library yang dipasang?",
          opsi: ["pnpm-workspace.yaml", "package-lock.json", "eslint.config.mjs", "postcss.config.mjs"],
          jawaban: 1,
          pembahasan: "npm menggunakan package-lock.json untuk mencatat versi library. pnpm dan Yarn memiliki file lock masing-masing.",
        },
        {
          soal: "Apa perbedaan utama ESLint dan Prettier?",
          opsi: [
            "ESLint menjalankan website; Prettier memasang library",
            "ESLint memeriksa masalah kode; Prettier merapikan format kode",
            "Keduanya hanya mengubah warna halaman",
            "Prettier wajib dipasang agar Next.js dapat berjalan",
          ],
          jawaban: 1,
          pembahasan: "ESLint memberi tahu masalah pada kode. Prettier merapikan format seperti spasi dan indentasi. Prettier adalah alat tambahan, bukan syarat menjalankan Next.js.",
        },
        {
          soal: "Siapa yang memeriksa kesalahan tipe data, seperti mengirim teks ke fungsi yang mengharapkan angka?",
          opsi: [
            "ESLint saat npm run lint",
            "Prettier saat merapikan file",
            "TypeScript — lewat editor dan saat npm run build",
            "Browser saat halaman dibuka",
          ],
          jawaban: 2,
          pembahasan: "Pemeriksaan tipe dilakukan TypeScript: garis merah di editor dan npm run build yang gagal jika ada kesalahan tipe. Script opsional \"typecheck\": \"tsc --noEmit\" bisa ditambahkan untuk memeriksa tipe tanpa build penuh.",
        },
        {
          soal: "Project menggunakan Tailwind CSS versi 4. Apa yang memuat Tailwind ke CSS global?",
          opsi: [
            "Membuat tailwind.config.js saja",
            "Menulis class di package.json",
            "Menambahkan @import \"tailwindcss\"; ke app/globals.css",
            "Menghapus postcss.config.mjs",
          ],
          jawaban: 2,
          pembahasan: "Pada setup Tailwind CSS v4 di project contoh, app/globals.css memuat Tailwind dengan @import \"tailwindcss\";. File ini diproses oleh plugin di postcss.config.mjs.",
        },
        {
          soal: "Manakah pasangan file dan alamat route yang benar?",
          opsi: [
            "app/profil/page.tsx → /app/profil",
            "pages/profil.tsx → /pages/profil",
            "app/profil/page.tsx → /profil dan pages/profil.tsx → /profil",
            "app/page.tsx → /beranda",
          ],
          jawaban: 2,
          pembahasan: "App Router memakai folder plus page.tsx. Pages Router memakai nama file di dalam pages/. Keduanya dapat mewakili /profil, tetapi jangan membuat route sama di kedua router dalam satu project.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
