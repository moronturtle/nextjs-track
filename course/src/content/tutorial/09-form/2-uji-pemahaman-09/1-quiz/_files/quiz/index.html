<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz — Form dan Validasi</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        padding: 2rem 1rem;
        background: #0f1117;
        color: #e4e6e9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .kartu { width: 100%; max-width: 560px; }
      .progres { margin-bottom: 0.5rem; color: #8b94a3; font-size: 0.85rem; }
      h1 { margin-bottom: 1.25rem; font-size: 1.35rem; line-height: 1.4; }
      .opsi {
        display: block;
        width: 100%;
        margin-bottom: 0.6rem;
        padding: 0.85rem 1rem;
        border: 1px solid #2a2f3f;
        border-radius: 8px;
        background: #1a1d27;
        color: #e4e6e9;
        font-size: 0.95rem;
        text-align: left;
        cursor: pointer;
      }
      .opsi:hover:not(:disabled) { border-color: #5b8def; }
      .opsi:disabled { cursor: default; }
      .opsi.benar { border-color: #3ecf8e; background: #16332a; }
      .opsi.salah { border-color: #f47272; background: #3a2222; }
      .pembahasan {
        display: none;
        margin-top: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        font-size: 0.9rem;
        line-height: 1.5;
      }
      .pembahasan.tampil { display: block; }
      .pembahasan.benar { border: 1px solid #3ecf8e; background: #16332a; }
      .pembahasan.salah { border: 1px solid #f47272; background: #3a2222; }
      .lanjut {
        display: none;
        margin-top: 1.25rem;
        padding: 0.7rem 1.5rem;
        border: 0;
        border-radius: 8px;
        background: #5b8def;
        color: #fff;
        font-size: 0.95rem;
        cursor: pointer;
      }
      .lanjut.tampil { display: inline-block; }
      .skor { margin: 1rem 0; font-size: 2.5rem; font-weight: 700; }
      .pesan { margin-bottom: 1.5rem; color: #aeb5c2; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main class="kartu" id="app" aria-live="polite"></main>
    <script>
      const SOAL = [
        {
          soal: "Apa yang dimaksud controlled input?",
          opsi: [
            "Input yang nilainya dipegang state React — value diisi dari state, onChange memperbarui state",
            "Input yang nilainya disimpan browser sampai submit",
            "Input yang tidak boleh diketik",
            "Input yang hanya menerima angka",
          ],
          jawaban: 0,
          pembahasan: "Pada controlled input, setiap huruf mengalir lewat state: onChange → setState → value. Nilai di layar selalu sama dengan isi state.",
        },
        {
          soal: "Kapan controlled input menjadi pilihan yang tepat?",
          opsi: [
            "Ketika nilai input dipakai langsung — misalnya untuk memfilter daftar saat mengetik",
            "Ketika form hanya dibaca saat submit",
            "Ketika kita ingin menghindari useState",
            "Ketika inputnya banyak dan render jadi lambat",
          ],
          jawaban: 0,
          pembahasan: "Controlled membuat nilai selalu tersedia di state — cocok untuk filter, validasi saat mengetik, atau mengosongkan kotak dari kode.",
        },
        {
          soal: "Apa beda value dan defaultValue pada input?",
          opsi: [
            "value mengunci isi input ke state; defaultValue hanya mengisi nilai awal lalu input menyimpan sendiri",
            "Keduanya sama saja",
            "defaultValue untuk teks, value untuk angka",
            "value hanya bisa dipakai di form kecil",
          ],
          jawaban: 0,
          pembahasan: "value menjadikan state sumber kebenaran (controlled). defaultValue hanya nilai awal — setelah itu input menyimpan ketikannya sendiri (uncontrolled).",
        },
        {
          soal: "Bagaimana cara membaca nilai form uncontrolled saat submit?",
          opsi: [
            "new FormData(event.currentTarget), lalu data.get('nama-input') berdasarkan atribut name",
            "document.querySelector untuk tiap input",
            "useState untuk tiap kolom",
            "Menyimpan input di localStorage",
          ],
          jawaban: 0,
          pembahasan: "FormData membaca semua input dalam form sekaligus berdasarkan atribut name-nya — tanpa useState dan tanpa onChange.",
        },
        {
          soal: "Kenapa validasi tetap dijalankan di server walau form sudah divalidasi di client?",
          opsi: [
            "Karena validasi client bisa dilewati — siapa pun bisa mengirim request langsung ke API tanpa form",
            "Karena server lebih cepat memeriksa",
            "Karena browser kadang mematikan validasi",
            "Karena hukumnya memang begitu",
          ],
          jawaban: 0,
          pembahasan: "Validasi client untuk pengalaman — cepat dan jelas. Validasi server untuk kebenaran — request bisa datang dari mana saja, tidak hanya dari form-mu.",
        },
        {
          soal: "Form punya validasi: nama minimal 3 karakter. Pengguna mengisi 'ab' lalu submit. Apa yang seharusnya terjadi?",
          opsi: [
            "Request tidak dikirim — pesan 'Nama minimal 3 karakter' tampil di bawah kolom nama",
            "Request tetap dikirim dan server yang menolak",
            "Input otomatis diperbaiki menjadi 'ab '",
            "Form dikosongkan supaya diisi ulang",
          ],
          jawaban: 0,
          pembahasan: "Fungsi validasi menemukan kesalahan → submit dihentikan → pesan tampil di kolomnya. Request tidak berangkat sama sekali.",
        },
        {
          soal: "Server membalas dengan 400 dan body { error: 'teks wajib diisi' }. Cara paling baik menanganinya?",
          opsi: [
            "Baca pesan error dari body dan tampilkan ke pengguna",
            "Tampilkan saja 'Terjadi kesalahan' tanpa detail",
            "Ulangi request sampai berhasil",
            "Abaikan — 400 berarti masalah server",
          ],
          jawaban: 0,
          pembahasan: "400 berarti isi request salah menurut aturan server, dan pesan di body menjelaskan penyebabnya — itulah yang pantas ditampilkan ke pengguna.",
        },
        {
          soal: "Kenapa form contoh memakai noValidate di tag <form>?",
          opsi: [
            "Supaya validasi HTML bawaan browser tidak bentrok dengan pesan validasi buatan kita",
            "Supaya form bisa dikirim tanpa isi",
            "Supaya input tidak bisa difokuskan",
            "Supaya TypeScript tidak protes",
          ],
          jawaban: 0,
          pembahasan: "Browser punya validasi bawaan (misalnya untuk type='email'). noValidate mematikannya supaya yang tampil hanya pesan buatan kita — bukan dua sistem sekaligus.",
        },
      ];

      let nomor = 0;
      let skor = 0;
      const app = document.getElementById("app");

      function tampilSoal() {
        const s = SOAL[nomor];
        app.innerHTML = `
          <p class="progres">Soal ${nomor + 1} dari ${SOAL.length}</p>
          <h1>${s.soal}</h1>
          ${s.opsi.map((opsi, i) => `<button class="opsi" data-i="${i}">${opsi}</button>`).join("")}
          <div class="pembahasan" id="pembahasan"></div>
          <button class="lanjut" id="lanjut">${nomor + 1 === SOAL.length ? "Lihat hasil" : "Soal berikutnya"}</button>
        `;
        document.querySelectorAll(".opsi").forEach((button) => {
          button.addEventListener("click", () => jawab(Number(button.dataset.i)));
        });
        document.getElementById("lanjut").addEventListener("click", () => {
          nomor++;
          nomor < SOAL.length ? tampilSoal() : tampilHasil();
        });
      }

      function jawab(pilihan) {
        const s = SOAL[nomor];
        const benar = pilihan === s.jawaban;
        if (benar) skor++;
        document.querySelectorAll(".opsi").forEach((button) => {
          const index = Number(button.dataset.i);
          button.disabled = true;
          if (index === s.jawaban) button.classList.add("benar");
          else if (index === pilihan) button.classList.add("salah");
        });
        const box = document.getElementById("pembahasan");
        box.className = `pembahasan tampil ${benar ? "benar" : "salah"}`;
        box.innerHTML = benar
          ? `<strong>Benar.</strong> ${s.pembahasan}`
          : `<strong>Belum tepat.</strong> Jawaban benar: <em>${s.opsi[s.jawaban]}</em>. ${s.pembahasan}`;
        document.getElementById("lanjut").classList.add("tampil");
      }

      function tampilHasil() {
        const pesan = skor === SOAL.length
          ? "Semua jawabanmu tepat. Kamu siap melanjutkan project tugas."
          : skor >= 3
            ? "Bagus. Baca kembali bagian yang jawabannya belum tepat, lalu lanjutkan ke tugas."
            : "Buka kembali materi yang jawabannya belum tepat, lalu coba quiz sekali lagi.";
        app.innerHTML = `
          <p class="progres">Quiz selesai</p>
          <h1>Skor kamu</h1>
          <p class="skor">${skor}/${SOAL.length}</p>
          <p class="pesan">${pesan}</p>
          <button class="lanjut tampil" id="ulang">Ulangi quiz</button>
        `;
        document.getElementById("ulang").addEventListener("click", () => {
          nomor = 0;
          skor = 0;
          tampilSoal();
        });
      }

      tampilSoal();
    </script>
  </body>
</html>
